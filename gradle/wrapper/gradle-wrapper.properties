distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
# Pins the distribution by content, not just by URL. Required for reproducible
# builds and it fails the build if the download is tampered with or swapped.
# Regenerate on a Gradle upgrade: curl -sSL <distributionUrl>.sha256
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
